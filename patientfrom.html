<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(135deg, #dbeafe, #f0f9ff);
}

.container {
    width: 90%;
    max-width: 950px;
    margin: 40px auto;
    background: #ffffff;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
}

.title {
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    margin-bottom: 25px;
}

h3 {
    color: #222;
    margin-top: 30px;
    margin-bottom: 10px;
}

.row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.field {
    flex: 1;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
    color: #555;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

textarea {
    resize: none;
}

.btn {
    margin-top: 30px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #ff7eb3, #ff758c);
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

@media (max-width: 700px) {
    .row {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<form onsubmit="goToSymptoms(event)">

<div class="title">📝 New Patient Registration</div>

<h3>Personal Information</h3>

<div class="row">
<div class="field">
<label>First Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Last Name</label>
<input type="text" required>
</div>
</div>

<div class="row">
<div class="field">
<label>Date of Birth</label>
<input type="date" required>
</div>

<div class="field">
<label>Gender</label>
<select required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>
</div>

<h3>Contact Information</h3>

<div class="row">
<div class="field">
<label>Phone Number</label>
<input type="tel" required>
</div>

<div class="field">
<label>Email</label>
<input type="email" required>
</div>
</div>

<h3>Address</h3>

<div class="row">
<div class="field">
<label>Address Line 1</label>
<input type="text">
</div>

<div class="field">
<label>Address Line 2</label>
<input type="text">
</div>
</div>

<div class="row">
<div class="field">
<label>City</label>
<input type="text" id="city" required>
</div>

<div class="field">
<label>State</label>
<input type="text" id="state" required>
</div>

<div class="field">
<label>Zip Code</label>
<input type="text">
</div>
</div>

<h3>Emergency Contact</h3>

<div class="row">
<div class="field">
<label>Name</label>
<input type="text">
</div>

<div class="field">
<label>Relationship</label>
<input type="text">
</div>

<div class="field">
<label>Phone</label>
<input type="tel">
</div>
</div>

<h3>Medical Information</h3>

<div class="row">
<div class="field">
<label>Known Allergies</label>
<textarea rows="3"></textarea>
</div>

<div class="field">
<label>Existing Conditions</label>
<textarea rows="3"></textarea>
</div>
</div>

<button type="submit" class="btn">Submit Patient Details</button>

</form>
</div>

<script>

function goToSymptoms(event) {
    event.preventDefault();

    let city = document.getElementById("city").value.trim();
    let state = document.getElementById("state").value.trim();

    let address = city + ", " + state;

    window.location.href = "symptoms2.html?address=" + encodeURIComponent(address);
}

</script>

</body>
</html>
