
  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Disease Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea, #00f2fe);
    margin: 0;
}

.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 700px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}

.result-box {
    background: #f4f6fb;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
}

.btn {
    padding: 14px 25px;
    border-radius: 30px;
    background: linear-gradient(135deg, #667eea, #00f2fe);
    color: white;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="card">

<h2>🧠 Smart Disease Prediction</h2>

<div class="result-box">
<p><strong>Disease:</strong> <span id="disease"></span></p>
<p><strong>Confidence:</strong> <span id="confidence"></span></p>
<p><strong>Advice:</strong> <span id="advice"></span></p>
</div>

<a id="hospitalBtn" class="btn">Find Nearby Hospital & Doctors</a>

</div>
</div>

<script>

/* GET DATA */
const params = new URLSearchParams(window.location.search);

let primary = (params.get("symptom") || "").toLowerCase();
let others = (params.get("others") || "").toLowerCase();
let address = params.get("address") || "India";

/* USER SYMPTOMS */
let userSymptoms = [primary, ...others.split(",")]
    .map(s => s.trim())
    .filter(Boolean);

/* 🔥 EXTENSIVE DISEASE DATABASE */
const diseases = [

{ name:"Dengue", symptoms:["fever","body pain","joint pain","fatigue","headache"], advice:"Consult doctor immediately." },
{ name:"COVID-19", symptoms:["fever","cough","breathing issue","fatigue"], advice:"Monitor oxygen and isolate." },
{ name:"Typhoid", symptoms:["fever","weakness","stomach pain","headache"], advice:"Avoid outside food." },
{ name:"Malaria", symptoms:["fever","chills","sweating","headache"], advice:"Blood test required." },
{ name:"Flu", symptoms:["fever","cough","body pain","fatigue"], advice:"Rest and hydration." },

{ name:"Migraine", symptoms:["headache","dizziness","nausea"], advice:"Rest in dark room." },
{ name:"Tension Headache", symptoms:["headache","stress"], advice:"Relaxation needed." },

{ name:"Food Poisoning", symptoms:["vomiting","diarrhea","stomach pain"], advice:"Drink ORS." },
{ name:"Gastritis", symptoms:["stomach pain","nausea","bloating"], advice:"Avoid spicy food." },

{ name:"Muscle Strain", symptoms:["body pain","fatigue"], advice:"Rest muscles." },
{ name:"Arthritis", symptoms:["joint pain","stiffness"], advice:"Consult orthopedic." },

{ name:"Common Cold", symptoms:["cold","cough","sore throat"], advice:"Warm fluids." },
{ name:"Allergy", symptoms:["skin rash","itching"], advice:"Avoid allergens." },

{ name:"Heart Issue", symptoms:["chest pain","breathing issue","fatigue"], advice:"Emergency care needed." },
{ name:"Asthma", symptoms:["breathing issue","cough"], advice:"Use inhaler." }

];

/* 🔥 ADVANCED SCORING SYSTEM */
let bestMatch = null;
let bestScore = 0;

diseases.forEach(d => {

    let matchCount = 0;

    d.symptoms.forEach(sym => {
        if (userSymptoms.some(u => u.includes(sym))) {
            matchCount++;
        }
    });

    let coverage = matchCount / d.symptoms.length;

    // Penalize if user has unrelated symptoms
    let mismatch = userSymptoms.filter(u =>
        !d.symptoms.some(sym => u.includes(sym))
    ).length;

    let score = coverage - (mismatch * 0.05);

    if (score > bestScore) {
        bestScore = score;
        bestMatch = d;
    }
});

/* RESULT */
let diseaseName = "No strong match";
let confidence = "Low";
let advice = "Consult doctor for accurate diagnosis.";

if (bestMatch && bestScore > 0.2) {
    diseaseName = bestMatch.name;
    confidence = Math.round(bestScore * 100) + "%";
    advice = bestMatch.advice;
}

/* DISPLAY */
document.getElementById("disease").innerText = diseaseName;
document.getElementById("confidence").innerText = confidence;
document.getElementById("advice").innerText = advice;

/* BUTTON */
document.getElementById("hospitalBtn").href =
    "nearbyhospital.html?address=" 
    + encodeURIComponent(address) 
    + "&disease=" 
    + encodeURIComponent(diseaseName);

</script>

</body>
</html>
